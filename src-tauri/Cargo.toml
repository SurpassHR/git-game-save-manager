[package]
name = "git-game-save-manager"
version = "2.0.0"
description = "Git-based game save manager"
authors = ["SurpassHR"]
edition = "2021"

[lib]
name = "git_game_save_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tauri-plugin-dialog = "2.6.0"
